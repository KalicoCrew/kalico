# Test config for unified_planner with a manual stepper extra G-code axis.
[manual_stepper basic_stepper]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 7
accel: 500

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
unified_planner: True
unified_notch_freq: 55
