name: Build test

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kalicocrew/kalico-ci:latest

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.changes.outputs.dependencies }}
      klipper: ${{ steps.changes.outputs.klipper }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dependencies:
              - 'pyproject.toml'
              - 'scripts/klippy-requirements.txt'
              - 'scripts/requirements_dev.txt'
            klipper:
              - 'pyproject.toml'
              - 'Makefile'
              - 'src/**'
              - 'lib/**'
              - 'test/configs/**'
              - 'scripts/Dockerfile-build'
              - 'scripts/buildcommands.py'
              - 'scripts/check-gcc.sh'

  # Builds the firmware for every test config and hands the resulting
  # dicts to the test jobs, which otherwise use the ones in the image
  firmware:
    needs: changes
    if: needs.changes.outputs.klipper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pull the latest image to take advantage of layer caching
      - name: Pull docker image
        run: docker pull $IMAGE

      - name: Test Klipper build (changes to the firmware)
        run: |
          set -o pipefail
          # Clean up docker output so that github ::group: instructions
          # get recognized
          docker build --progress=plain -f scripts/Dockerfile-build \
            -t $IMAGE . 2>&1 \
            | sed -u -E 's/^#[0-9]+ [0-9.]+ ?//g'

      - name: Extract dicts
        run: docker run --rm --entrypoint tar $IMAGE -C /ci_build -c dict | tar -x

      - uses: actions/upload-artifact@v7
        with:
          name: dict
          path: dict
          retention-days: 1

  dependencies:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Ensure scripts/klippy-dependencies.txt is up to date
        uses: nickcharlton/diff-check@v1.0.0
        with:
          command: |
            docker run -v $PWD:/klipper $IMAGE uv export --frozen -o scripts/klippy-requirements.txt --no-dev --no-hashes
            docker run -v $PWD:/klipper $IMAGE uv export --frozen -o scripts/requirements_dev.txt --only-dev --no-hashes

  test:
    needs: [changes, firmware]
    # Run when firmware was skipped, but not when it failed
    if: ${{ !cancelled() && needs.firmware.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Test Klippy (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: needs.firmware.result == 'success'
        with:
          name: dict
          path: dict

      - name: Test Klippy
        env:
          DICTDIR: ${{ needs.firmware.result == 'success' && '/klipper/dict' || '/ci_build/dict' }}
        run: docker run -v $PWD:/klipper -e DICTDIR $IMAGE --python ${{ matrix.python }} py.test -n auto
