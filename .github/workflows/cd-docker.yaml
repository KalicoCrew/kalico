name: Kalico Container Build and Push

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag; publishes it and latest instead of main"
        type: string
        required: false
  push:
    branches:
      - main
    paths:
      - "klippy/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/cd-docker.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # git describe needs history and tags for klippy/.version
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse untagged builds outside main
        if: ${{ !inputs.tag && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Only main or a release tag can be published"
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ inputs.tag && format('ghcr.io/kalicocrew/kalico:{0}', inputs.tag) || 'ghcr.io/kalicocrew/kalico:main' }}
            ${{ inputs.tag && 'ghcr.io/kalicocrew/kalico:latest' || '' }}
