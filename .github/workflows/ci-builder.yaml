name: Klipper Container Build and Push

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish in addition to latest"
        type: string
        required: false
  push:
    branches:
      - main
    # This should mirror the klipper paths-filter in ci-build_test.yaml
    paths:
      - "Makefile"
      - "pyproject.toml"
      - "src/**"
      - "lib/**"
      - "test/configs/**"
      - "scripts/Dockerfile-build"
      - "scripts/buildcommands.py"
      - "scripts/check-gcc.sh"
      - "scripts/ci-build.sh"
      - ".github/workflows/ci-builder.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kalicocrew/kalico-ci

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker build -f scripts/Dockerfile-build -t $IMAGE:latest \
            ${TAG:+-t $IMAGE:$TAG} .

      - name: Push
        run: docker push --all-tags $IMAGE
