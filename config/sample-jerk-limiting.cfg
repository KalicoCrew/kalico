# Jerk-limited motion with a per-ramp notch law
#
# This renders normal queued moves as discretized jerk-limited acceleration
# slices instead of one hard acceleration step, and can approximate a shaper
# zero on a fixed structural resonance. See docs/Jerk_Limiting.md.
#
# Add these options to the [printer] section. All are opt-in: with
# unified_planner off (the default) motion is unchanged.

#[printer]
#unified_planner: True
#   Enable jerk-limited motion. Off by default. Requires a notch frequency:
#   set unified_notch_freq, or both unified_notch_freq_x and
#   unified_notch_freq_y. Use unified_planner: False, or SET_UNIFIED ENABLE=0,
#   to turn the planner off -- a 0 notch frequency is not the way to do it.
#
#unified_notch_freq: 0
#   Park the accel-ramp's shaper zero on this mode frequency (Hz), using the
#   per-ramp law J = dv * f_n^2. For an ideal unsaturated triangular accel
#   pulse this pins T_rise = 1/f_n; emitted slices approximate that response.
#   If that would exceed max_accel, the planner uses J = max_accel * f_n and a
#   constant-acceleration plateau, preserving the ideal ramp-edge zero while
#   honoring max_accel. Insufficient runway still loses the zero. Find the value
#   with a TUNING_TOWER sweep of
#   notch_freq against a ringing/ghosting test.
#   Must be 0 or at least 5 Hz -- every ramp lasts 2/f_n seconds, so a very low
#   frequency stalls the machine instead of shaping it gently.
#   NOTE: f_n also sets a throughput ceiling on short segments. A ramp needs
#   (v0+v1)/f_n of travel, so a chain of L-mm segments tops out near f_n*L mm/s
#   (55 Hz, 1 mm segments -> ~55 mm/s) regardless of max_velocity/max_accel.
#   See the Throughput section of docs/Jerk_Limiting.md.
#   0 = off.
#
#unified_span_ramps: True
#   Let ONE ramp cover a run of consecutive near-collinear moves, so the runway
#   is the run's length instead of a single segment's. This fixes the same
#   short-segment ceiling (~f_n*L mm/s) WITHOUT moving the zero:
#   the ramp keeps its 2/f_n shape, so it still cancels f_n exactly. A 0.2 mm
#   segment chain at 55 Hz goes from ~11 mm/s to the requested feedrate.
#   Runs break at direction changes over unified_span_max_angle, at notch-target
#   changes, and wherever a corner or feedrate limit would be exceeded. Accel
#   limits may vary within a run; the emitter uses the run's lowest limit.
#   True = on (the default). Set False to get the strict per-move behaviour.
#
#unified_span_max_angle: 2.0
#   Largest heading change (degrees) one ramp may span. Turning mid-ramp leaves
#   the TURNING axis a truncated pulse, which has no null at f_n: the residual
#   is ~2*sin(angle/2)*0.159 against the ~0.0066 the emitter's discretization
#   already leaves. 2 deg is under that floor; 5 deg is ~2x it, 18 deg ~8x.
#   Raise it only to span coarser geometry, and expect ringing in return.
#
#unified_notch_freq_x: 0
#unified_notch_freq_y: 0
#   Optional PER-AXIS notch modes (Hz). Naming two DIFFERENT modes asks for two
#   zeros, and gets them: spectral zeros multiply under convolution, and the
#   single-zero ramp is already rect(1/f_n)*rect(1/f_n) in a(t). Widening one
#   rect makes the pulse a TRAPEZOID, rect(1/f_hi)*rect(1/f_lo), whose spectrum
#   nulls f_x AND f_y. Every axis sees the same a(t) scaled by the move's
#   direction, so every axis gets both zeros on every heading -- diagonals are
#   not a compromise. Set these when X and Y have different measured modes
#   (e.g. a bed-slinger: heavy Y at a low freq, lighter X higher).
#
#   Cost: the ramp lasts 1/f_x + 1/f_y instead of 2/f_n (about 2% longer than a
#   single zero at their mean, for ~0.04% left at each mode instead of a few
#   percent), and its peak accel is dv*min(f_x,f_y) -- LOWER than the single-zero
#   ramp's. If that peak exceeds max_accel only one zero fits; the planner keeps
#   whichever mode it helps more and logs second_notch_saturated.
#
#   Omit both to use the single unified_notch_freq for every direction, and set
#   them EQUAL for exactly the same thing. They must be set TOGETHER: setting
#   exactly one is a config error.
#
#unified_max_da: 0
#   Optional cap (mm/s^2) on positive acceleration changes between emitted
#   slices. 0 = off. The emitter shrinks slice time to keep jerk-up steps within
#   this cap. That step has no floor, so a small value is checked at startup:
#   settings needing over 4096 slices to ramp 0 -> max_velocity are rejected.
#
#unified_jerk_dt: 0.001
#   Integration time step (s) for the emitted ramp. Smaller = smoother ramp and
#   more motion-queue entries. Minimum is 0.0001. It must provide at least 10
#   slices across the fastest configured notch edge
#   (jerk_dt * max_notch_frequency <= 0.1).

# Live tuning (no restart), e.g. for a TUNING_TOWER sweep:
#   SET_UNIFIED ENABLE=1 NOTCH_FREQ=55
#   SET_UNIFIED                       # report current state
#
# Example TUNING_TOWER to find the mode frequency (park zero, print a ringing
# tower, read the cleanest band's Z height back to a frequency):
#   TUNING_TOWER COMMAND=SET_UNIFIED PARAMETER=notch_freq \
#       START=30 STEP_DELTA=4 STEP_HEIGHT=5 SKIP=2
#
# NOTE: max_accel still matters. If it is low, large ramps use a
# constant-acceleration plateau and take longer. If it is deliberately high, more
# ramps stay triangular and acceleration is governed mostly by the notch law.
